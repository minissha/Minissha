  <defs>

    <!-- Background -->
    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#0B0B0D"/>
      <stop offset="100%" stop-color="#171116"/>
    </linearGradient>

    <!-- Pink gradient -->
    <linearGradient
      id="pink"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop offset="0%" stop-color="#D45B91"/>
      <stop offset="100%" stop-color="#F09CBD"/>
    </linearGradient>

    <!-- Soft pink glow -->
    <filter id="pinkGlow">
      <feGaussianBlur
        stdDeviation="5"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


